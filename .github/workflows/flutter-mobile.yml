name: Flutter Mobile - Analyze and Test

on:
  push:
    branches:
      - flutter-migration
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-mobile.yml'
  pull_request:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-mobile.yml'

permissions:
  contents: read

jobs:
  flutter-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - name: Generate Android and iOS project scaffolding
        run: flutter create --platforms=android,ios --org br.com.atlanticdrones --project-name smartfarm_mobile .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-pub
      - name: Widget tests
        run: flutter test --no-pub -r expanded
